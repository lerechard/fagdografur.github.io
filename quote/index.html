<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Estimate a FAGDOGRAFUR photography shoot.">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <title>FAGDOGRAFUR — Shoot Estimate</title>
  <style>
    :root {
      --accent-yellow: #ffee00;
      --accent-blue: #00aaff;
      --bg-dark: #111;
      --bg-header: #1a1a1a;
      --bg-form: #1e1e1e;
      --bg-control: #2a2a2a;
      --border-dark: #333;
      --border-mid: #444;
      --text-light: #f0f0f0;
      --text-muted: #aaa;
    }

    * { box-sizing: border-box; }

    html { color-scheme: dark; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Segoe UI', sans-serif;
      font-size: 16px;
    }

    header {
      position: relative;
      z-index: 1;
      padding: 2rem 1rem;
      text-align: center;
      border-bottom: 4px solid var(--border-dark);
      background-color: rgba(26, 26, 26, 1);
      transition: background-color 0.4s ease;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }

    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url('banner.png') center center / cover no-repeat;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    header.active { background-color: rgba(26, 26, 26, 0.4); }
    header.active::before { opacity: 1; }

    header h1 {
      margin: 0;
      color: var(--accent-yellow);
      font-size: clamp(2rem, 6vw, 2.5rem);
      letter-spacing: 0.1em;
      line-height: 1.1;
      text-transform: uppercase;
    }

    #title-text {
      display: inline-block;
      transition: opacity 0.4s ease;
    }

    .estimate-section {
      min-height: calc(100vh - 110px);
      padding: 3rem 1rem 4rem;
      background: var(--bg-form);
      border-top: 6px solid var(--accent-blue);
    }

    main {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .intro {
      margin: 0 0 2.25rem;
      text-align: center;
    }

    .intro h2 {
      margin: 0 0 0.65rem;
      color: var(--accent-yellow);
      font-size: 2rem;
    }

    .intro p {
      margin: 0 auto;
      max-width: 560px;
      color: var(--text-muted);
      line-height: 1.55;
    }

    .row {
      padding: 1.45rem 0;
      border-top: 1px solid var(--border-dark);
    }

    .row:last-of-type { border-bottom: 1px solid var(--border-dark); }

    .row-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    label,
    .label {
      color: var(--text-light);
      font-weight: 700;
    }

    .value {
      color: var(--accent-yellow);
      font-weight: 700;
      white-space: nowrap;
    }

    button,
    input { font: inherit; }

    .duration {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.55rem;
    }

    .duration button {
      min-height: 48px;
      padding: 0.7rem 0.4rem;
      border: 2px solid var(--border-mid);
      border-radius: 9px;
      background: var(--bg-control);
      color: var(--text-light);
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
    }

    .duration button:hover {
      transform: translateY(-1px);
      border-color: var(--accent-blue);
    }

    .duration button[aria-pressed="true"] {
      border-color: var(--accent-yellow);
      background: var(--accent-yellow);
      color: #000;
    }

    .range-wrap {
      display: grid;
      grid-template-columns: 1fr 90px;
      gap: 1rem;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-yellow);
      cursor: pointer;
    }

    input[type="number"] {
      width: 100%;
      height: 44px;
      padding: 0 0.65rem;
      border: 1px solid #666;
      border-radius: 8px;
      outline: none;
      background: var(--bg-control);
      color: var(--text-light);
      text-align: center;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="number"]:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px rgba(0, 170, 255, 0.12);
    }

    .check-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin: 0;
      accent-color: var(--accent-yellow);
      cursor: pointer;
    }

    #groupOptions {
      display: none;
      margin-top: 1.35rem;
      padding: 1.15rem;
      border: 1px solid var(--border-dark);
      border-radius: 10px;
      background: #191919;
    }

    #groupOptions.active { display: block; }
    .subrow + .subrow { margin-top: 1.4rem; }

    .total {
      margin-top: 2.5rem;
      padding: 1.5rem;
      border: 2px solid var(--border-mid);
      border-top: 6px solid var(--accent-blue);
      border-radius: 12px;
      background: #191919;
      text-align: center;
    }

    .total-label {
      margin-bottom: 0.5rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.85rem;
    }

    .price {
      margin: 0;
      color: var(--accent-yellow);
      font-size: clamp(4rem, 16vw, 7.5rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
      font-weight: 800;
    }

    .summary {
      margin-top: 1.15rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .copy {
      width: 100%;
      min-height: 52px;
      margin-top: 1.5rem;
      padding: 0.9rem 1rem;
      border: none;
      border-radius: 10px;
      background: var(--accent-yellow);
      color: #000;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 800;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .copy:hover {
      background: #cc0;
      transform: translateY(-1px);
    }

    .copy:focus-visible,
    .duration button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--accent-blue);
      outline-offset: 2px;
    }

    @media (max-width: 640px) {
      header { padding: 1.6rem 0.75rem; }
      header h1 { font-size: 2rem; }

      .estimate-section { padding: 2rem 1rem 3rem; }
      .intro h2 { font-size: 1.5rem; }

      .duration { grid-template-columns: repeat(3, 1fr); }

      .range-wrap {
        grid-template-columns: 1fr 76px;
        gap: 0.75rem;
      }

      .price { font-size: clamp(3.8rem, 20vw, 6rem); }
      .total { padding: 1.25rem 1rem; }
    }
  </style>
</head>
<body>
  <header id="main-header" aria-label="FAGDOGRAFUR header">
    <h1><span id="title-text">FAGDOGRAFUR QUOTER</span></h1>
  </header>

  <section class="estimate-section">
    <main>
      <div class="intro">
        <h2>Shoot Estimate</h2>
        <p>Build a quick estimate for your session. Adjust the options below and the total updates automatically.</p>
      </div>

      <section class="row">
        <div class="row-head">
          <div class="label">Duration</div>
          <div class="value" id="durationValue">1 hour</div>
        </div>

        <div class="duration" id="durationButtons">
          <button type="button" data-hours="0.5" aria-pressed="false">30m</button>
          <button type="button" data-hours="1" aria-pressed="true">1h</button>
          <button type="button" data-hours="1.5" aria-pressed="false">1.5h</button>
          <button type="button" data-hours="2" aria-pressed="false">2h</button>
          <button type="button" data-hours="3" aria-pressed="false">3h</button>
          <button type="button" data-hours="4" aria-pressed="false">4h</button>
        </div>
      </section>

      <section class="row">
        <div class="row-head">
          <label for="photos">Final exported photos</label>
          <div class="value" id="photosValue">12</div>
        </div>

        <div class="range-wrap">
          <input id="photos" type="range" min="5" max="80" value="12" step="1">
          <input id="photosNumber" type="number" min="5" max="80" value="12" step="1">
        </div>
      </section>

      <section class="row">
        <label class="check-row" for="groupEvent">
          <span>Group event</span>
          <input id="groupEvent" type="checkbox">
        </label>

        <div id="groupOptions">
          <div class="subrow">
            <div class="row-head">
              <label for="attendees">Attendees</label>
              <div class="value" id="attendeesValue">20</div>
            </div>
            <div class="range-wrap">
              <input id="attendees" type="range" min="2" max="100" value="20" step="1">
              <input id="attendeesNumber" type="number" min="2" max="100" value="20" step="1">
            </div>
          </div>

          <div class="subrow">
            <div class="row-head">
              <label for="groupPhotos">Group photos</label>
              <div class="value" id="groupPhotosValue">3</div>
            </div>
            <div class="range-wrap">
              <input id="groupPhotos" type="range" min="0" max="20" value="3" step="1">
              <input id="groupPhotosNumber" type="number" min="0" max="20" value="3" step="1">
            </div>
          </div>
        </div>
      </section>

      <section class="total" aria-live="polite">
        <div class="total-label">Estimated total</div>
        <p class="price" id="price">$215</p>
        <div class="summary" id="summary"></div>
        <button type="button" class="copy" id="copy">Copy estimate</button>
      </section>
    </main>
  </section>

  <script>
    const header = document.getElementById('main-header');
    const titleSpan = document.getElementById('title-text');
    const originalText = titleSpan.textContent;
    const altText = "🏳️‍🌈+🦮=📸";
    let headerPinned = false;

    function setHeader(active) {
      header.classList.toggle('active', active);
      titleSpan.style.opacity = 0;
      setTimeout(() => {
        titleSpan.textContent = active ? altText : originalText;
        titleSpan.style.opacity = 1;
      }, 200);
    }

    header.addEventListener('mouseenter', () => setHeader(true));
    header.addEventListener('mouseleave', () => setHeader(headerPinned));
    header.addEventListener('click', () => {
      headerPinned = !headerPinned;
      setHeader(headerPinned);
    });

    const WEBHOOK_URL =
      "https://discord.com/api/webhooks/1557506619666075658/XjeBIcC6G9I5mRl-DB93sws-RT_4Fw7hq5WO7xQs_XsFDTVDxK7ce3YoXqoL48W9oNpn";

    const PRICING = {
      duration: {
        "0.5": 110,
        "1": 175,
        "1.5": 240,
        "2": 300,
        "3": 410,
        "4": 520
      },
      includedPhotos: 8,
      photoTier1End: 20,
      photoTier2End: 40,
      photoTier1: 10,
      photoTier2: 8,
      photoTier3: 6,
      groupBase: 65,
      includedAttendees: 10,
      extraAttendee: 2,
      includedGroupPhotos: 2,
      extraGroupPhoto: 12
    };

    const state = {
      hours: 1,
      photos: 12,
      groupEvent: false,
      attendees: 20,
      groupPhotos: 3
    };

    const $ = id => document.getElementById(id);
    const durationButtons = [...document.querySelectorAll("[data-hours]")];

    function money(value) {
      return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
        maximumFractionDigits: 0
      }).format(value);
    }

    function durationLabel(hours) {
      if (hours === 0.5) return "30 minutes";
      if (hours === 1) return "1 hour";
      return `${hours} hours`;
    }

    function editingPrice(count) {
      let remaining = Math.max(0, count - PRICING.includedPhotos);
      let total = 0;

      const firstTier = Math.min(
        remaining,
        PRICING.photoTier1End - PRICING.includedPhotos
      );
      total += firstTier * PRICING.photoTier1;
      remaining -= firstTier;

      if (remaining > 0) {
        const secondTier = Math.min(
          remaining,
          PRICING.photoTier2End - PRICING.photoTier1End
        );
        total += secondTier * PRICING.photoTier2;
        remaining -= secondTier;
      }

      if (remaining > 0) total += remaining * PRICING.photoTier3;
      return total;
    }

    function calculate() {
      let total = PRICING.duration[String(state.hours)];
      total += editingPrice(state.photos);

      if (state.groupEvent) {
        total += PRICING.groupBase;
        total += Math.max(0, state.attendees - PRICING.includedAttendees) * PRICING.extraAttendee;
        total += Math.max(0, state.groupPhotos - PRICING.includedGroupPhotos) * PRICING.extraGroupPhoto;
      }

      return total;
    }

    function summaryText() {
      let text = `${durationLabel(state.hours)} · ${state.photos} final photos`;

      if (state.groupEvent) {
        text += ` · ${state.attendees} attendees · ${state.groupPhotos} group photos`;
      }

      return text;
    }

    function render() {
      $("durationValue").textContent = durationLabel(state.hours);
      $("photosValue").textContent = state.photos;
      $("attendeesValue").textContent = state.attendees;
      $("groupPhotosValue").textContent = state.groupPhotos;
      $("price").textContent = money(calculate());
      $("summary").textContent = summaryText();
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, Number(value)));
    }

    function bindPair(rangeId, numberId, key, min, max) {
      const range = $(rangeId);
      const number = $(numberId);

      function set(value) {
        const next = clamp(value, min, max);
        state[key] = next;
        range.value = next;
        number.value = next;
        render();
        queueWebhook();
      }

      range.addEventListener("input", () => set(range.value));
      number.addEventListener("input", () => {
        if (number.value !== "") set(number.value);
      });
      number.addEventListener("blur", () => set(number.value || min));
    }

    durationButtons.forEach(button => {
      button.addEventListener("click", () => {
        state.hours = Number(button.dataset.hours);

        durationButtons.forEach(item => {
          item.setAttribute(
            "aria-pressed",
            String(item === button)
          );
        });

        render();
        queueWebhook();
      });
    });

    bindPair("photos", "photosNumber", "photos", 5, 80);
    bindPair("attendees", "attendeesNumber", "attendees", 2, 100);
    bindPair("groupPhotos", "groupPhotosNumber", "groupPhotos", 0, 20);

    $("groupEvent").addEventListener("change", event => {
      state.groupEvent = event.target.checked;
      $("groupOptions").classList.toggle("active", state.groupEvent);
      render();
      queueWebhook();
    });

    $("copy").addEventListener("click", async () => {
      const text = `${money(calculate())} — ${summaryText()}`;

      try {
        await navigator.clipboard.writeText(text);
        $("copy").textContent = "Copied";
        setTimeout(() => $("copy").textContent = "Copy estimate", 1000);
      } catch {
        window.prompt("Copy estimate:", text);
      }
    });

    async function sendWebhook(content) {
      try {
        await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            content,
            allowed_mentions: { parse: [] }
          }),
          keepalive: true
        });
      } catch (_) {}
    }

    const sessionId =
      (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2))
      .slice(0, 8);

    sendWebhook(
      `Estimator opened\nSession: ${sessionId}\nTime: ${new Date().toISOString()}`
    );

    let webhookTimer;

    function queueWebhook() {
      clearTimeout(webhookTimer);

      webhookTimer = setTimeout(() => {
        let details =
          `Estimate: ${money(calculate())}\n` +
          `Duration: ${durationLabel(state.hours)}\n` +
          `Final photos: ${state.photos}\n` +
          `Group event: ${state.groupEvent ? "yes" : "no"}`;

        if (state.groupEvent) {
          details +=
            `\nAttendees: ${state.attendees}` +
            `\nGroup photos: ${state.groupPhotos}`;
        }

        sendWebhook(
          `${details}\nSession: ${sessionId}\nTime: ${new Date().toISOString()}`
        );
      }, 900);
    }

    render();
  </script>
</body>
</html>
